# Include INSIDE the existing HTTPS server {} for global.kolyach.me.
# Assumes nginx runs on the Docker host and APP_PORT=3000.
# This file does not define or replace certificates, listen directives or other routes.

location = /telegram/webhook {
    client_max_body_size 64k;

    # No trailing slash: preserve /telegram/webhook when forwarding to Node.js.
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Telegram-Bot-Api-Secret-Token $http_x_telegram_bot_api_secret_token;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    proxy_next_upstream off;
    proxy_cache off;
}

location = /healthz {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 5s;
    proxy_cache off;
    access_log off;
}
